    <path d="M18 1 H228 Q249 1 249 22" fill="none" stroke="#FFFFFF" stroke-opacity=".42"/>
    <text x="22" y="33" fill="#BFDBFE" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" letter-spacing="2">BUILDING AT THE INTERSECTION</text>
    <circle cx="31" cy="60" r="4" fill="#67E8F9"/><text x="47" y="65" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">AI applications</text>
    <circle cx="31" cy="88" r="4" fill="#60A5FA"/><text x="47" y="93" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">Full-stack systems</text>
