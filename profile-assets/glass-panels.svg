    <rect x="806" y="324" width="354" height="174" rx="22" fill="url(#panel)" stroke="url(#edge)" stroke-width="1.5"/>
    <path d="M828 325 H1128 Q1159 325 1159 356" fill="none" stroke="url(#shine)" stroke-width="2"/>
    <text x="832" y="365" fill="#67E8F9" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">OPEN TO</text>
