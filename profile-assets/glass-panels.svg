    <rect x="405" y="72" width="755" height="180" rx="22" fill="url(#panel)" stroke="url(#edge)" stroke-width="1.5"/>
    <path d="M427 73 H1128 Q1159 73 1159 104" fill="none" stroke="url(#shine)" stroke-width="2"/>
    <text x="438" y="111" fill="#67E8F9" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">WHAT I BUILD</text>
    <text x="438" y="151" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="20">Practical products—from voice-enabled AI tools and data-driven apps</text>
    <text x="438" y="180" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="20">to systems that keep working when the internet is unavailable.</text>
