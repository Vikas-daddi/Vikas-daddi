    <text x="66" y="365" fill="#67E8F9" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">EDUCATION</text>
    <text x="66" y="400" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">B.E. Computer Science</text>
    <text x="66" y="426" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">&amp; Engineering · Data Science</text>
    <text x="66" y="457" fill="#BFDBFE" font-family="Segoe UI,Arial,sans-serif" font-size="15">Karavali Institute of Technology · VTU</text>
    <text x="66" y="480" fill="#94A3B8" font-family="Segoe UI,Arial,sans-serif" font-size="14">2023–2027</text>
