    <text x="24" y="94" fill="#CBD5E1" font-family="Segoe UI,Arial,sans-serif" font-size="16">Offline disaster communication with ESP32 and LoRa.</text>
    <text x="24" y="119" fill="#94A3B8" font-family="Segoe UI,Arial,sans-serif" font-size="15">Built end to end · two nodes tested over 1 km</text>
