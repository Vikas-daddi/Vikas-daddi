<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1240" viewBox="0 0 1200 1240" role="img" aria-labelledby="title desc">
  <title id="title">Vikas Daddi — profile and project panels</title>
  <desc id="desc">Glossy blue, three-dimensional glass panels for Vikas Daddi’s profile, education, experience, career focus, and eight selected projects.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2=".95" y2="1">
      <stop offset="0" stop-color="#16355E" stop-opacity=".98"/>
      <stop offset=".48" stop-color="#0B1D38" stop-opacity=".98"/>
      <stop offset="1" stop-color="#101A32" stop-opacity=".98"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E0F2FE" stop-opacity=".06"/>
      <stop offset=".5" stop-color="#BAE6FD" stop-opacity=".55"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0F2FE" stop-opacity=".7"/>
      <stop offset=".42" stop-color="#60A5FA" stop-opacity=".28"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <radialGradient id="ambient">
      <stop offset="0" stop-color="#38BDF8" stop-opacity=".24"/>
      <stop offset="1" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
    <g id="card">
      <rect x="7" y="10" width="100%" height="100%" rx="22" fill="#020817" fill-opacity=".62"/>
    </g>
  </defs>
  <circle cx="1120" cy="90" r="250" fill="url(#ambient)"/>
  <circle cx="80" cy="1000" r="250" fill="url(#ambient)"/>
  <text x="42" y="48" fill="#7DD3FC" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">PROFILE / SNAPSHOT</text>
  <text x="1158" y="48" text-anchor="end" fill="#64748B" font-family="Segoe UI,Arial,sans-serif" font-size="14" letter-spacing="2">AI · FULL-STACK · DATA</text>

  <g>
    <rect x="40" y="72" width="345" height="180" rx="22" fill="#020817" fill-opacity=".55" transform="translate(0 8)"/>
    <rect x="40" y="72" width="345" height="180" rx="22" fill="url(#panel)" stroke="url(#edge)" stroke-width="1.5"/>
    <path d="M62 73 H352 Q384 73 384 105" fill="none" stroke="url(#shine)" stroke-width="2"/>
    <path d="M40 210 H385" stroke="#38BDF8" stroke-opacity=".12"/>
    <text x="66" y="112" fill="#67E8F9" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">BUILDER</text>
    <text x="66" y="153" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">Vikas Daddi</text>
    <text x="66" y="185" fill="#BFDBFE" font-family="Segoe UI,Arial,sans-serif" font-size="17">AI · Full-Stack · Data Science</text>
    <circle cx="344" cy="111" r="5" fill="#67E8F9"/>
    <circle cx="344" cy="111" r="10" fill="none" stroke="#67E8F9" stroke-opacity=".25"/>
  </g>
  <g>
