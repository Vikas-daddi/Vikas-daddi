    <text x="24" y="119" fill="#94A3B8" font-family="Segoe UI,Arial,sans-serif" font-size="15">and ZIP creation in the browser.</text>
  </g>
  <g transform="translate(614 1084)">
    <rect x="7" y="9" width="546" height="145" rx="20" fill="#020817" fill-opacity=".62"/><rect width="546" height="145" rx="20" fill="url(#panel)" stroke="url(#edge)" stroke-width="1.5"/><path d="M20 1 H522 Q545 1 545 24" stroke="url(#shine)" fill="none" stroke-width="2"/>
    <text x="24" y="34" fill="#67E8F9" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">08 · SEMANTIC MATCHING</text>
