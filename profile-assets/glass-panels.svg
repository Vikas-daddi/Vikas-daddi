    <circle cx="840" cy="431" r="4" fill="#60A5FA"/><text x="856" y="437" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="17">Full-stack engineering</text>
    <circle cx="840" cy="463" r="4" fill="#A5B4FC"/><text x="856" y="469" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="17">Data analysis</text>
