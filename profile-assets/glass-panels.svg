    <path d="M445 325 H746 Q777 325 777 356" fill="none" stroke="url(#shine)" stroke-width="2"/>
    <text x="449" y="365" fill="#67E8F9" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">PRACTICAL EXPERIENCE</text>
