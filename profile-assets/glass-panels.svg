    <text x="24" y="66" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">VD-EventHub</text>
    <text x="24" y="94" fill="#CBD5E1" font-family="Segoe UI,Arial,sans-serif" font-size="16">MERN event platform with QR tickets, check-in,</text>
    <text x="24" y="119" fill="#94A3B8" font-family="Segoe UI,Arial,sans-serif" font-size="15">role-based dashboards, and analytics.</text>
